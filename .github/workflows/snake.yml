name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {} 
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: jarif-bie04
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23306998&color_dots=%23e9f5e9,%23a8dab5,%2357bb8a,%231e8449,%23145a32
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFD43B&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
